<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully suppress benign WebSocket and HMR client transport errors in iframe environment
      window.addEventListener('error', function(e) {
        var msg = e && (e.message || '');
        var file = (e && e.filename) || '';
        if (msg.includes('WebSocket') || msg.includes('createWebSocketModuleRunnerTransport') || file.includes('@vite/client')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && (e.reason && (e.reason.message || String(e.reason))) || '';
        if (reason.includes('WebSocket') || reason.includes('createWebSocketModuleRunnerTransport') || reason.includes('failed to connect')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <title>Pay Manager - Smart Debt & Group Expense Manager</title>
    <meta name="description" content="Production-grade core data architecture, multi-currency conversion, graph debt simplification engine, and offline-first sync queue for Pay Manager." />

    <meta property="og:description" content="Production-grade core data architecture, multi-currency conversion, graph debt simplification engine, and offline-first sync queue for Pay Manager." />
