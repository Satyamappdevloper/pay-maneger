# Render Blueprint for EqualPay Full-Stack Deployment
services:
  - type: web
    name: equalpay-app
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: equalpay-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: EXCHANGE_RATE_API_KEY
        sync: false

databases:
  - name: equalpay-postgres
    plan: starter
    databaseName: equalpay_db
    user: equalpay_user
